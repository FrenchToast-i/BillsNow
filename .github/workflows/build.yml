name: Build BillsNow

# Builds the app + live-score widget on Apple's macOS cloud runners and
# uploads the unsigned .ipa as an artifact. No Mac needed on your side.
#
#  1. Push this repository to GitHub.
#  2. Actions tab -> "Build BillsNow" -> Run workflow (or just push again).
#  3. When it finishes, open the run, scroll to Artifacts, download
#     BillsNow-ipa, and install it on the jailbroken iPad (see README).

on:
  workflow_dispatch:        # lets you press "Run workflow" manually
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-14        # macOS 14 image, ships Xcode 15/16
    permissions:
      contents: read

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build app + widget (unsigned)
        run: ./scripts/build-unsigned.sh

      - name: Decode self-test against live ESPN data
        run: |
          rm -rf scripts/decode-check/Sources
          mkdir -p scripts/decode-check/Sources
          cp Shared/*.swift scripts/decode-check/Sources/
          cp scripts/decode-check/main.swift scripts/decode-check/Sources/
          cd scripts/decode-check && swift run DecodeCheck

      - name: Sign with ldid (for jailbroken install)
        run: ./scripts/sign-with-ldid.sh

      - name: Upload signed .ipa (install with Filza, no re-signing)
        uses: actions/upload-artifact@v4
        with:
          name: BillsNow-signed-ipa
          path: build/BillsNow-signed.ipa
          if-no-files-found: error

      - name: Upload unsigned .ipa (for Sideloadly / TrollStore)
        uses: actions/upload-artifact@v4
        with:
          name: BillsNow-unsigned-ipa
          path: build/BillsNow.ipa
          if-no-files-found: error